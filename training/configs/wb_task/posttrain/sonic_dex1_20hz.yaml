# @package _global_
defaults:
  - /wb_task/_base/posttrain
  - override /data: sonic_dex1_20hz
  - override /model: sonic_latent66
  - _self_

posttrain_task: block_into_cup_sonic31_latent66_20hz
batch_size: 1
num_workers: 4
resume: null
init_from_checkpoint: ${oc.env:WBWAM_MIDTRAIN_CHECKPOINT}
fk_link_loss:
  enabled: false
sonic_eef_loss:
  enabled: true
  lambda_fk: 0.05
  beta_rot: 0.1
  position_weight: 1.0
  checkpoint: ${oc.env:WBWAM_SONIC_DECODER_CHECKPOINT,/share/2025slx/DIT4DIT/sonic_ckpt/sonic_v1_1/last.pt}
  sonic_root: ${oc.env:WBWAM_SONIC_ROOT,/share/2025slx/WAM/training/checkpoints/sonic_fk_assets}
data:
  archives: null
  val_set_proportion: 0.1
  stats_downsample_rate: 1
  return_fk_targets: false
wandb:
  enabled: false
  mode: offline

# Avoid non-finite AdamW updates on large ZeRO flat partitions in torch 2.7.1.
optimizer_foreach: false
optimizer_max_group_numel: 500000000
